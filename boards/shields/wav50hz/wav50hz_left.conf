# RGB underglow configuration
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=50
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# encoder support
CONFIG_EC11=n
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=n

# The board defconfig sets CONFIG_ZMK_USB=y for all builds, but the
# peripheral side must not compile usb_hid.c — it depends on hid.c
# which is central-only, and Zephyr USB_HID class is not enabled here.
# Explicitly suppress USB on the peripheral to avoid linker errors.
CONFIG_ZMK_USB=n
