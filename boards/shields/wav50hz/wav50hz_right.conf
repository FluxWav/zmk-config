# Right side is central with PS/2 TrackPoint

# RGB underglow configuration
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=50
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# GPIO subsystem (required for CLK, DAT, RST interrupt handling)
CONFIG_GPIO=y

# External power (5V rail to VIK connector — required for TrackPoint)
CONFIG_ZMK_EXT_POWER=y

# Mouse/TrackPoint support
CONFIG_ZMK_MOUSE=y
CONFIG_INPUT=y

# Encoder support
CONFIG_EC11=n
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=n

# USB serial logging (debug session — remove before final build)
CONFIG_ZMK_USB_LOGGING=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
