# Right side is central with Procyon trackpad

# RGB underglow configuration
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=50
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# GPIO subsystem (required for CHG interrupt pin)
CONFIG_GPIO=y

# Mouse/Trackpad support (petejohanson's branch uses ZMK_MOUSE, not ZMK_POINTING)
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_TRACKPAD=y
CONFIG_INPUT=y
CONFIG_I2C=y

# MaxTouch driver for Procyon
CONFIG_INPUT_MICROCHIP_MAXTOUCH=y

# Trackpad dimensions (Procyon 42x50mm)
# Increased logical dimensions for faster cursor movement (George Norton's approach)
# Touch detection uses driver defaults for stability
CONFIG_ZMK_TRACKPAD_LOGICAL_X=3150
CONFIG_ZMK_TRACKPAD_LOGICAL_Y=3750
CONFIG_ZMK_TRACKPAD_PHYSICAL_X=420
CONFIG_ZMK_TRACKPAD_PHYSICAL_Y=500
CONFIG_ZMK_TRACKPAD_FINGERS=5

# Logging disabled - causes Kconfig errors in petejohanson's branch
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG=y

# encoder support
CONFIG_EC11=n
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=n
