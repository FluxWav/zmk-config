# Right side is central with PS/2 TrackPoint

# RGB underglow configuration
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=50
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# GPIO subsystem (required for CLK, DAT, RST interrupt handling)
CONFIG_GPIO=y

# Mouse/TrackPoint support
CONFIG_ZMK_MOUSE=y
CONFIG_INPUT=y
CONFIG_UART=y

# PS/2 TrackPoint driver (infused-kim/kb_zmk_ps2_mouse_trackpoint_driver)
CONFIG_ZMK_INPUT_MOUSE_PS2_ENABLE=y

# Encoder support
CONFIG_EC11=n
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=n
