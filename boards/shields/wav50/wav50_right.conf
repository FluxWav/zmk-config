CONFIG_SPI=y

# RGB underglow configuration
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_EXT_POWER=n
CONFIG_ZMK_BLE=y

# Procyon trackpad support
CONFIG_GPIO=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=n
CONFIG_ZMK_TRACKPAD=y
CONFIG_INPUT=y
CONFIG_I2C=y
CONFIG_INPUT_MICROCHIP_MAXTOUCH=y
CONFIG_ZMK_TRACKPAD_LOGICAL_X=2100
CONFIG_ZMK_TRACKPAD_LOGICAL_Y=2500
CONFIG_ZMK_TRACKPAD_PHYSICAL_X=420
CONFIG_ZMK_TRACKPAD_PHYSICAL_Y=500
CONFIG_ZMK_TRACKPAD_FINGERS=5

# P0.29 is reserved for the Procyon CHG interrupt.
CONFIG_EC11=n
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=n
