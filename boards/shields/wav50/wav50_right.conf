CONFIG_SPI=y

# RGB underglow configuration
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n
CONFIG_ZMK_EXT_POWER=n

# Procyon trackpad support
CONFIG_GPIO=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_TRACKPAD=y
CONFIG_INPUT=y
CONFIG_I2C=y
CONFIG_INPUT_MICROCHIP_MAXTOUCH=y
CONFIG_ZMK_TRACKPAD_LOGICAL_X=6300
CONFIG_ZMK_TRACKPAD_LOGICAL_Y=7500
CONFIG_ZMK_TRACKPAD_PHYSICAL_X=420
CONFIG_ZMK_TRACKPAD_PHYSICAL_Y=500
CONFIG_ZMK_TRACKPAD_FINGERS=5

# encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
