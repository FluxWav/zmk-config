CONFIG_SPI=y

# RGB underglow configuration
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_EXT_POWER=n

CONFIG_GPIO=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# Procyon disabled for battery isolation testing.
CONFIG_ZMK_MOUSE=n
CONFIG_ZMK_POINTING=n
CONFIG_ZMK_TRACKPAD=n
CONFIG_ZMK_INPUT_SPLIT=n
CONFIG_INPUT=n
CONFIG_I2C=n
CONFIG_INPUT_MICROCHIP_MAXTOUCH=n
CONFIG_ZMK_TRACKPAD_LOGICAL_X=6300
CONFIG_ZMK_TRACKPAD_LOGICAL_Y=7500
CONFIG_ZMK_TRACKPAD_PHYSICAL_X=1680
CONFIG_ZMK_TRACKPAD_PHYSICAL_Y=2000
CONFIG_ZMK_TRACKPAD_FINGERS=5

# P0.29 is reserved for the Procyon CHG interrupt.
CONFIG_EC11=n
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=n
